<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>星舰 · 舰长控制台</title>
<style>
  :root{
    --bg:#04060a;
    --panel:#0a0e14;
    --line:rgba(150,170,190,.14);
    --line2:rgba(150,170,190,.07);
    --text:#d6dde4;
    --dim:#5f6b78;
    --dim2:#7d8a97;
    --acc:#6fc3c9;
    --ok:#8fbf7a;
    --warn:#d9a441;
    --crit:#e0564f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
    font-size:14px;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:grid;
    place-items:center;
  }
  .mono{font-family:'Share Tech Mono','Consolas',monospace}

  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }

  .landing{
    position:relative;z-index:10;
    width:min(720px,92vw);
    text-align:center;
    padding:40px 24px;
  }
  .mark{
    width:72px;height:72px;margin:0 auto 24px;
    display:grid;place-items:center;
    border:1px solid rgba(111,195,201,.6);color:var(--acc);
    font-size:36px;transform:rotate(45deg);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(111,195,201,.3)}
    50%{box-shadow:0 0 24px 4px rgba(111,195,201,.2)}
  }
  .mark b{transform:rotate(-45deg);font-weight:400}

  h1{font-size:clamp(28px,5vw,42px);letter-spacing:.34em;margin-bottom:8px;color:#e6ecf1}
  h1 span{font-family:'Share Tech Mono',monospace;font-size:.55em;color:var(--dim);letter-spacing:.3em;margin-left:16px;vertical-align:middle}
  .subtitle{font-size:14px;color:var(--dim2);letter-spacing:.22em;margin-bottom:40px;text-transform:uppercase}

  .btn{
    display:inline-flex;align-items:center;gap:12px;
    padding:16px 40px;
    background:transparent;border:1px solid rgba(111,195,201,.5);
    color:var(--acc);font-size:15px;letter-spacing:.3em;cursor:pointer;
    transition:all .2s;
  }
  .btn:hover{background:rgba(111,195,201,.12);color:#e6f6f7;box-shadow:0 0 24px rgba(111,195,201,.15)}
  .btn:active{transform:scale(.98)}
  .btn .arrow{font-family:'Share Tech Mono',monospace;font-size:1.2em;transition:transform .2s}
  .btn:hover .arrow{transform:translateX(4px)}

  .meta{margin-top:48px;padding-top:24px;border-top:1px solid var(--line2);color:var(--dim);font-size:12px;letter-spacing:.14em;line-height:2}
  .meta a{color:var(--acc);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  .meta a:hover{border-color:var(--acc)}
  .meta kbd{
    font-family:'Share Tech Mono',monospace;
    background:rgba(148,168,190,.08);border:1px solid var(--line2);
    padding:1px 6px;border-radius:3px;font-size:.9em;margin:0 2px
  }

  @media (prefers-reduced-motion: reduce){
    .mark,.btn .arrow{animation:none}
  }
</style>
</head>
<body>
<div class="landing">
  <div class="mark"><b>▣</b></div>
  <h1>星舰 · 舰长控制台<span>CAPTAIN CONSOLE</span></h1>
  <p class="subtitle">深空战术母舰 · CNS-07</p>
  <a class="btn" href="./console/captain-console.html" target="_blank" rel="noopener">
    进入舰桥 <span class="arrow">→</span>
  </a>
  <div class="meta">
    单文件 Vue 3 + Canvas 2D + WebAudio · 离线可运行<br>
    风格参考 <a href="https://www.spacex.com/vehicles/dragon/" target="_blank" rel="noopener">SpaceX Dragon</a> 与 <a href="https://movie.douban.com/subject/1291546/" target="_blank" rel="noopener">《流浪地球 2》 MOSS</a><br>
    快捷键：<kbd>Q</kbd>/<kbd>E</kbd> 切换子系统 · <kbd>1/2/3</kbd> 切换面板 · <kbd>Space</kbd> 开火
  </div>
</div>
</body>
</html>
